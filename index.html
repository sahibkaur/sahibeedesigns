<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahibee Designs</title>
<meta name="robots" content="noai, noimageai">
<meta name="description" content="Sahibee Designs is the portfolio of Sahib Kaur, a UX and product designer in Chandigarh. Coming soon.">
<meta property="og:title" content="Sahibee Designs">
<meta property="og:description" content="UX and product design by Sahib Kaur. Coming soon.">
<meta property="og:url" content="https://sahibeedesigns.com/">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600&family=Shantell+Sans:wght@400&display=swap">
<style>
:root{
  --bg:#FFFFFF;
  --ink:#10292C;
  --muted:#5E7174;
  --teal:#005F6B;
  --gold:#F2C14E;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Manrope','Helvetica Neue',Arial,sans-serif;
  --hand:'Shantell Sans','Comic Sans MS',cursive;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;display:flex;flex-direction:column;height:100vh;height:100svh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-height:560px){html,body{overflow:hidden}}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

/* Illustration: the two flying bees are cut out of the artwork and float on their own */
/* the jar sits left of the artwork's middle, so nudge it onto the page's centre line */
.art{position:relative;width:min(400px,82vw,42vh);aspect-ratio:1400/880;transform:translateX(7.5%)}
.art img{display:block;width:100%;height:auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;pointer-events:none}
.slot{position:absolute;background:var(--bg)}
.slot.l{left:11.786%;top:13.636%;width:12.857%;height:18.75%}
.slot.r{left:66.429%;top:47.159%;width:13.214%;height:18.182%}
.bee{position:absolute;inset:0;overflow:hidden}
.bee img{position:absolute;max-width:none}
.slot.l img{width:777.78%;left:-91.667%;top:-72.727%}
.slot.r img{width:756.757%;left:-502.703%;top:-259.375%}
.slot.l .bee{animation:hover1 2.6s ease-in-out infinite}
.slot.r .bee{animation:hover2 3.2s ease-in-out infinite}
@keyframes hover1{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(2px,-7px) rotate(-4deg)}}
@keyframes hover2{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-3px,-6px) rotate(3deg)}}

.hi{font-family:var(--hand);color:var(--teal);font-size:17px;margin-top:clamp(12px,3vh,28px)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,min(8vw,10vh),92px);line-height:1;letter-spacing:-.03em;margin-top:4px}
h1 em{color:var(--teal);font-style:italic}
.tag{display:inline-block;margin-top:12px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.soon{font-family:var(--serif);font-size:clamp(20px,min(2.4vw,3.2vh),28px);margin-top:clamp(14px,3.4vh,32px);max-width:22em;text-wrap:balance}
.mark{background:linear-gradient(transparent 62%,var(--gold) 62%,var(--gold) 92%,transparent 92%);padding-inline:.06em}
.note{color:var(--muted);margin-top:8px;max-width:32em}
footer{text-align:center;font-size:14px;color:var(--muted);padding-top:12px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
main{padding-top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:600px){
  .note{font-size:15px}
  footer{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="art">
    <img src="https://mir-s3-cdn-cf.behance.net/project_modules/1400/208dfc106276529.5f8c8f9f82d22.png" alt="Beebeeyian, an illustration by Sahib Kaur of bees flying around a honey jar" width="1400" height="880" draggable="false" oncontextmenu="return false">
    <div class="slot l" aria-hidden="true"><div class="bee"><img src="https://mir-s3-cdn-cf.behance.net/project_modules/1400/208dfc106276529.5f8c8f9f82d22.png" alt="" draggable="false"></div></div>
    <div class="slot r" aria-hidden="true"><div class="bee"><img src="https://mir-s3-cdn-cf.behance.net/project_modules/1400/208dfc106276529.5f8c8f9f82d22.png" alt="" draggable="false"></div></div>
  </div>
  <p class="hi">hi, I'm Sahib</p>
  <h1>Sahi<em>bee</em></h1>
  <span class="tag">Designs</span>
  <p class="soon">The hive is <span class="mark">under construction.</span></p>
  <p class="note">A UX and product design portfolio is buzzing in soon, with case studies, doodles and a little bit of play.</p>
</main>
<footer>© 2026 Sahibee Designs, by Sahib Kaur</footer>
</body>
</html>
