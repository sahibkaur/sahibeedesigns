<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Back soon · Sahibee Designs</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noai, noimageai">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
<style>
/* Sahibee Designs portfolio. One typeface (Satoshi).
   Borrowed patterns: floating pill nav, centred hero, rounded work cards and numbered section rules (alexdontsov.com);
   intro line and column rhythm (samarthnayyar.com); paper-toned doodle room (dontlookup.app);
   tiny index-style meta and a full-width wordmark to close (grids03.obys.agency, vivmgmt.com). */
:root{
  --bg:#FFFFFF;
  --ink:#10292C;
  --text:#2E3B3A;
  --muted:#66706F;
  --line:#E6E8E7;
  --wash:#F3F5F4;
  --paper:#F6F4EF;
  --teal:#005F6B;
  --gold:#F2C14E;
  --sans:'Satoshi','Helvetica Neue',Arial,sans-serif;
  /* type scale */
  --t-display:clamp(34px,3.9vw,52px);
  --t-h2:clamp(28px,2.9vw,40px);
  --t-h3:clamp(20px,1.8vw,26px);
  --t-lead:clamp(18px,1.5vw,21px);
  --t-body:17px;
  --t-small:14px;
  --t-label:12px;
  --max:1120px;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--t-body);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:4px}
img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
i,em{font-style:normal}
.wrap{max-width:calc(var(--max) + 48px);margin-inline:auto;padding-inline:max(24px,env(safe-area-inset-left,0px))}
.ln{background-image:linear-gradient(currentColor,currentColor);background-size:100% 1px;background-position:0 100%;background-repeat:no-repeat;padding-bottom:2px;transition:background-size .3s}
.ln:hover{background-image:linear-gradient(var(--gold),var(--gold));background-size:100% 2px}
.bee-mark{width:30px;height:24px;flex:none;overflow:visible}

/* Navigation: a full-width bar that tucks into a floating pill once you scroll */
.nav-wrap{position:fixed;inset:0 0 auto;z-index:50;padding-top:max(12px,env(safe-area-inset-top,0px));pointer-events:none}
.pill{pointer-events:auto;margin-inline:auto;width:min(calc(100% - 48px),var(--max));height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 4px;border-radius:999px;background:rgba(255,255,255,0);border:1px solid transparent;transition:width .5s cubic-bezier(.2,.7,.2,1),padding .5s,background .3s,box-shadow .3s,border-color .3s}
.nav-wrap.tucked .pill{width:min(calc(100% - 32px),640px);padding:0 22px 0 10px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:var(--line);box-shadow:0 10px 30px -12px rgba(16,41,44,.18)}
.me{display:inline-flex;align-items:center;gap:12px;font-size:16px;font-weight:500;color:var(--ink)}
.me img{width:42px;height:42px;border-radius:50%;object-fit:cover;pointer-events:none}
.links{display:flex;gap:26px;font-size:var(--t-small);font-weight:500;color:var(--muted)}
.links a:hover{color:var(--ink)}
.cta{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:500;color:var(--ink)}
.cta svg{width:20px;height:20px}
.cta:hover svg{transform:translate(2px,-2px);transition:transform .25s}

/* Hero: centred, like a calm title card */
.hero{position:relative;text-align:center;padding-top:clamp(150px,17vw,210px);padding-bottom:clamp(24px,3vw,40px)}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;font-size:var(--t-small);color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:7px}
.meta svg{width:16px;height:16px}
.hero h1{font-size:var(--t-display);font-weight:700;line-height:1.16;letter-spacing:-.022em;color:var(--ink);max-width:20ch;margin:22px auto 0;text-wrap:balance}
.hero h1 i{color:var(--teal)}
.hero .lead{font-size:var(--t-lead);line-height:1.55;color:var(--muted);max-width:34em;margin:20px auto 0;text-wrap:pretty}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;font-size:15px;font-weight:500;border:1px solid var(--ink);transition:background .2s,color .2s,transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{background:var(--teal);border-color:var(--teal)}
.btn.ghost{color:var(--ink)}
.btn.ghost:hover{background:var(--wash)}

/* the bee and its dashed trail come straight from Sahib's Beebeeyian illustration */
.flight{position:absolute;right:-40px;top:clamp(96px,9vw,120px);width:min(22%,270px);height:auto;pointer-events:none;overflow:visible}
@media (max-width:1240px){.flight{right:0}}
.flight .trail{fill:none;stroke:#4A2E1E;stroke-opacity:.45;stroke-width:2.4;stroke-dasharray:10 9;stroke-linecap:round}
.flight .rv{fill:none;stroke:#fff;stroke-width:14;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s .3s cubic-bezier(.55,.1,.3,1) forwards}
.flight .bee{opacity:0;transform-box:fill-box;transform-origin:center;animation:arrive .7s 2.5s ease-out forwards,hover 3.4s 3.2s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes arrive{from{opacity:0;transform:translate(-14px,6px) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes hover{0%,100%{opacity:1;transform:none}50%{opacity:1;transform:translateY(-5px) rotate(-4deg)}}

/* Section heads: title, a hairline, and the section number */
.sec{padding-block:clamp(64px,8vw,112px)}
.sh{display:flex;align-items:center;gap:24px;margin-bottom:clamp(32px,4vw,48px)}
.sh h2,.sh .num{font-size:var(--t-h2);font-weight:700;letter-spacing:-.015em;line-height:1.1;color:var(--ink);white-space:nowrap}
.sh .rule{flex:1;height:1px;background:var(--line)}
.sh .num{font-variant-numeric:tabular-nums}
.sub{font-size:var(--t-small);color:var(--muted);margin:-28px 0 clamp(32px,4vw,44px)}

/* Work: rounded cards; the first is featured full width, the rest sit two by two */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.card{display:flex;flex-direction:column;background:var(--wash);border-radius:24px;overflow:hidden;padding:clamp(28px,3vw,40px) clamp(24px,3vw,40px) 0;text-align:center;transition:background .3s}
.card:hover{background:#EDF1F0}
.card.feature{grid-column:1/-1}
.card h3{font-size:var(--t-h3);font-weight:700;letter-spacing:-.01em;line-height:1.25;color:var(--ink)}
.card .tags{font-size:var(--t-small);color:var(--muted);margin-top:6px}
.card .tags b{font-weight:400;color:var(--muted)}
.card .shot{margin-top:clamp(24px,3vw,36px);border-radius:14px 14px 0 0;overflow:hidden;aspect-ratio:16/10;background:#E4E9E8;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card.feature .shot{aspect-ratio:16/8;max-width:920px;width:100%;margin-inline:auto}
.card .shot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.card:hover .shot{transform:translateY(-6px)}

/* Doodles: a paper-toned room for the drawings */
.paper{background:var(--paper)}
.dotw{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:center;margin-bottom:clamp(48px,6vw,72px)}
.dotw .frame{grid-column:1/span 5;aspect-ratio:4/5;overflow:hidden;border-radius:20px;background:#ECE8E0}
.dotw .frame img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;pointer-events:none}
.dotw .txt{grid-column:7/span 5}
.label{font-size:var(--t-label);font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.dotw h3{font-size:var(--t-h2);font-weight:700;letter-spacing:-.015em;line-height:1.15;color:var(--ink);margin-top:12px}
.dotw p.d{color:var(--muted);margin-top:12px;max-width:28em}
.dotw a{display:inline-block;margin-top:22px;font-size:var(--t-small);font-weight:500;color:var(--ink)}
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,1.8vw,24px)}
.gallery .frame{aspect-ratio:4/5;overflow:hidden;border-radius:16px;background:#ECE8E0}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.gallery a:hover img{transform:scale(1.03)}
.gallery .cap{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:var(--t-small);color:var(--ink)}
.gallery .cap span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.gallery .cap span:last-child{flex:1}
.more{margin-top:clamp(28px,4vw,44px);text-align:center}

/* About */
.about{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:24px;align-items:start}
.portrait{grid-column:1/span 5;aspect-ratio:4/5;overflow:hidden;border-radius:24px;background:var(--wash)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;pointer-events:none}
.bio{grid-column:7/span 6}
.bio .intro{font-size:var(--t-h3);font-weight:500;line-height:1.4;letter-spacing:-.01em;color:var(--ink)}
.bio .plain{color:var(--muted);margin-top:20px;max-width:34em}
.name{margin-top:36px;padding:22px 24px;border-radius:18px;background:var(--wash);display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start}
.name .bee-mark{width:36px;height:29px;grid-row:span 2;margin-top:2px}
.name .word{font-size:var(--t-body);font-weight:700;color:var(--ink)}
.name .word i{color:var(--teal)}
.name .word small{font-size:var(--t-small);font-weight:400;color:var(--muted);margin-left:8px}
.name .def{font-size:var(--t-small);color:var(--muted);max-width:32em}
.skills{margin-top:32px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;list-style:none;counter-reset:sk}
.skills li{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;color:var(--ink);counter-increment:sk}
.skills li::before{content:counter(sk,decimal-leading-zero);font-size:var(--t-label);color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}

/* Contact */
.contact{text-align:center}
.contact h2{font-size:var(--t-display);font-weight:700;letter-spacing:-.022em;line-height:1.16;color:var(--ink);max-width:16ch;margin-inline:auto;text-wrap:balance}
.contact p{color:var(--muted);margin-top:14px}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 28px;margin-top:28px;font-size:var(--t-small);font-weight:500;color:var(--ink)}

/* Footer: small index-style details, then the name set full width */
footer{border-top:1px solid var(--line);overflow:hidden}
.fmeta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding-block:32px;font-size:var(--t-label);line-height:1.6;color:var(--muted)}
.fmeta b{display:block;font-weight:500;color:var(--ink)}
.fmeta a:hover{color:var(--ink)}
.logo{display:inline-flex;align-items:center;gap:10px}
.logo .t{display:flex;flex-direction:column;line-height:1}
.logo .t b{font-size:20px;font-weight:700;letter-spacing:-.035em;color:var(--ink)}
.logo .t span{font-size:8px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.logo .bee-mark{width:37px;height:30px}

@media (max-width:900px){
  .flight{display:none}
  .links{display:none}
  .grid{grid-template-columns:1fr}
  .card.feature .shot{aspect-ratio:16/10}
  .dotw .frame,.dotw .txt,.portrait,.bio{grid-column:1/-1}
  .dotw .frame,.portrait{max-width:440px}
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fmeta{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .pill{height:58px}
  .me img{width:38px;height:38px}
  .me,.cta{font-size:15px}
  .sh{gap:16px}
  .skills{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}.flight .rv{stroke-dashoffset:0}.flight .bee{opacity:1}}

/* Blog: coming soon */
.soon{position:relative;text-align:center;min-height:calc(100svh - 120px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:140px;padding-bottom:80px}
.soon .label{display:inline-flex;align-items:center;gap:8px}
.soon .label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(242,193,78,.25)}
.soon h1{font-size:var(--t-display);font-weight:700;line-height:1.16;letter-spacing:-.022em;color:var(--ink);max-width:16ch;margin-top:18px;text-wrap:balance}
.soon h1 i{color:var(--teal)}
.soon .lead{font-size:var(--t-lead);line-height:1.55;color:var(--muted);max-width:32em;margin-top:18px;text-wrap:pretty}
.soon .flight{top:clamp(100px,12vw,140px)}

/* Loader: the Beebeeyian bee flies its dashed trail while the page loads */
.loader{display:none}
html.is-loading body{overflow:hidden}
html.is-loading .loader{display:flex;position:fixed;inset:0;z-index:100;background:#fff;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease}
html.is-loading .loader.out{opacity:0}
html.is-loading .flight *{animation-play-state:paused}
.loader svg{width:min(320px,72vw);height:auto;overflow:visible}
.loader .ltrail{fill:none;stroke:#4A2E1E;stroke-opacity:.45;stroke-width:2.4;stroke-dasharray:10 9;stroke-linecap:round}
.loader .lmask{fill:none;stroke:#fff;stroke-width:16;stroke-dasharray:1}
.loader p{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* error screens */
.soon .flight.art{position:static;display:block;width:min(340px,78%);margin:0 auto 8px}
button.btn{font-family:inherit;cursor:pointer}
.err-code{font-size:var(--t-label);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:10px}
</style>
</head>

<script>
  // tuck the nav into a floating pill once the page scrolls
  (function(){
    var nav=document.getElementById('nav');
    function onScroll(){ nav.classList.toggle('tucked', window.scrollY > 40); }
    onScroll(); window.addEventListener('scroll', onScroll, {passive:true});
  })();
</script>
